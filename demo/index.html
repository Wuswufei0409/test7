<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>R3 玩家控制演示 — 网页 Minecraft 复刻</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; color: #dfe6f0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #gl { display: block; width: 100vw; height: 100vh; }
    #overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      text-align: center; background: rgba(6,9,14,.82); z-index: 5; cursor: pointer;
    }
    #overlay h1 { font-size: 20px; margin: 0 0 8px; }
    #overlay p { margin: 4px 0; font-size: 13px; color: #9fb0c4; }
    #hud {
      position: fixed; left: 12px; bottom: 12px; z-index: 3; pointer-events: none;
      font-size: 12px; line-height: 1.6; background: rgba(10,14,20,.72); padding: 8px 10px;
      border: 1px solid rgba(255,255,255,.12); border-radius: 6px;
    }
    #hud b { color: #7fe3b0; }
    .badge { display:inline-block; padding: 1px 6px; margin-left:6px; border-radius:4px; font-size:11px; }
    .on { background:#1f6f4b; color:#d6ffe9; }
    .off { background:#3a3a44; color:#aab; }
    #xhair { position: fixed; left: 50%; top: 50%; width: 18px; height: 18px; transform: translate(-50%,-50%);
      z-index: 2; pointer-events: none; }
    #xhair:before, #xhair:after { content:''; position:absolute; background:#fff; }
    #xhair:before { left:50%; top:0; width:1px; height:100%; transform:translateX(-50%); }
    #xhair:after { top:50%; left:0; height:1px; width:100%; transform:translateY(-50%); }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="overlay">
    <div>
      <h1>R3 玩家控制演示</h1>
      <p>点击画面锁定鼠标 · WASD 移动 · 空格 跳跃/游泳上浮</p>
      <p>Shift 疾跑 · Ctrl 下蹲 · 鼠标 视角</p>
      <p>场景含：平台 / 墙体 / 半格台阶(自动跨越) / 水池(游泳)</p>
    </div>
  </div>
  <div id="hud"></div>
  <div id="xhair"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
